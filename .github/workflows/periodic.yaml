name: Periodic actions

# This workflow performs periodic cleanup of AWS resources
# It uses the holodeck cleanup command to remove VPCs tagged with Project=holodeck and Environment=cicd

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0,12 * * *' # Runs daily at 12AM and 12PM

jobs:
  cleanup:
    runs-on: linux-amd64-cpu4
    strategy:
      fail-fast: false
      matrix:
        aws-region: [us-west-1, us-west-2, us-east-1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ matrix.aws-region }}

      - name: Identify resources for deletion
        id: identify-resources
        shell: bash
        env:
          AWS_REGION: ${{ matrix.aws-region }}
        run: |
          # 6h floor: the cron is 12-hourly, so a true leak is still removed within about 18h.
          vpcs=$(bash scripts/select-stale-vpcs.sh 6)
          echo "Selected VPCs: ${vpcs:-none}"
          echo "AWS_VPC_IDS=$vpcs" >> "$GITHUB_OUTPUT"

      - name: Clean up VPCs
        if: steps.identify-resources.outputs.AWS_VPC_IDS != ''
        uses: NVIDIA/holodeck@v0.5.1
        with:
          action: cleanup
          vpc_ids: ${{ steps.identify-resources.outputs.AWS_VPC_IDS }}
          aws_region: ${{ matrix.aws-region }}
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          force_cleanup: 'true'

      - name: Post cleanup
        shell: bash
        env:
          VPC_IDS: ${{ steps.identify-resources.outputs.AWS_VPC_IDS }}
          REGION: ${{ matrix.aws-region }}
        run: |
          read -r -a ids <<< "$VPC_IDS"
          echo "Selected ${#ids[@]} VPC(s) for cleanup in region $REGION"
